name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - staging
  # Lets update-game-data.yml deploy its own commit: a push made with GITHUB_TOKEN does not
  # fire the push trigger above, but a GITHUB_TOKEN workflow_dispatch is allowed.
  workflow_dispatch:

# One deploy per ref at a time: a push and the data bot's dispatch can land within seconds of
# each other and must not finish out of order (a newer pending run replaces an older pending one).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=star-rupture-planner --branch=${{ github.ref_name }}
