name: Check for game data updates

# Runs daily at 06:00 UTC. Also allows manual triggering from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Refresh game data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Use a PAT or the default GITHUB_TOKEN. The default token's push
          # will trigger the deploy workflow because we use `workflow_dispatch`
          # style commit, but for schedule-triggered pushes the deploy workflow
          # fires automatically on push to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh game data and icons
        run: npm run refresh-data

      - name: Check for changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New game data detected!"
            git diff --cached --stat
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-update game data $(date -u +%Y-%m-%d)"
          git push
