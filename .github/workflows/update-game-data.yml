name: Check for game data updates

# Runs daily at 06:00 UTC. Also allows manual triggering from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # lets the last step dispatch deploy.yml

jobs:
  update:
    name: Refresh game data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The default GITHUB_TOKEN. A push made with it does NOT trigger push-based
          # workflows (GitHub blocks that to prevent loops), so deploy.yml does not run
          # for the bot commit by itself. The last step dispatches it explicitly instead
          # (workflow_dispatch is the one event GITHUB_TOKEN may trigger).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh game data and icons
        env:
          # Authenticates the version-discovery API call (5000 req/h instead of 60).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run refresh-data

      - name: Check for changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New game data detected!"
            git diff --cached --stat
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-update game data $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy the data commit
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
